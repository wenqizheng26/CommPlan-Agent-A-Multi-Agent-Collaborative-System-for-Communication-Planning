<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>通信公式 · 本地 RAG</title>
<link rel="stylesheet" href="/assets/katex/katex.min.css"><link rel="stylesheet" href="/assets/app.css">
<script defer src="/assets/katex/katex.min.js"></script><script defer src="/assets/app.js"></script>
</head><body>
<header><div><h1>通信公式 · 本地 RAG</h1><p>描述环境，查找依据，复核计算。</p></div><span class="status" id="runtime">正在读取运行状态</span></header>
<main>
<section class="panel input-panel"><h2>描述你的通信问题</h2>
<form id="queryform">
<label for="question">已知环境、参数和想求的量</label>
<textarea id="question" placeholder="可直接输入问题或粘贴参数。例如：按自由空间基准，频率4.5GHz，距离200米，求传输损耗。"></textarea>
<div class="examples" id="examples"></div><p class="small">自动识别目标与传播条件；缺少信息时提示补充。</p>
<details id="manual-options"><summary>修正识别（可选）</summary>
<label for="target">计算目标</label><select id="target"><option value="">自动识别</option></select>
<label for="condition">传播条件</label><select id="condition"><option value="">自动识别</option><option value="free_space_reference">自由空间基准</option><option value="free_space">理想自由空间模型</option><option value="non_free_space">遮挡、散射等其他传播</option></select>
</details>
<details id="parameter-options"><summary>补充参数（可选）</summary><p class="small">仅填写需要补充或纠正的值。留空不作修改；无损耗需明确填 0。</p><div class="fieldgrid" id="fields"></div></details>
<button class="primary" id="submit" type="submit">检索公式并计算</button>
</form></section>
<section id="result-panel" tabindex="-1"><div class="panel">
<div class="bar"><h2 id="resulttitle">查询结果</h2><button class="download" id="download" hidden>保存结果 JSON</button></div>
<div id="results" aria-live="polite"><div class="empty">输入一个问题，或点选示例。<p>结果将展示识别结论、程序计算值和采用公式。</p></div></div>
</div><details class="panel retrieval-panel"><summary>检索依据</summary><div id="retrieved" class="small">查询后显示候选公式。</div></details></section>
<section class="panel library-panel"><details id="formula-collection"><summary class="collection-heading">公式集合 <span id="formula-count"></span><span class="small">表达式 · 参数定义 · 适用条件 · 来源</span></summary><div id="catalogdetails"></div><p class="small">新增公式经本地导入、审核和样例校验后使用。</p></details></section>
</main><footer>结果适用于已登记的公式和条件。自由空间基准、链路余量不代表现场传播或可用率已经验证。</footer>
</body></html>
