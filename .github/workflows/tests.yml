name: Regression tests
on: [push, pull_request]
jobs:
  planning-minimal:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Planning runtime
        shell: pwsh
        run: |
          python -m pip install -r requirements-planning.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Planning deterministic regression
        shell: pwsh
        run: |
          python -B -X utf8 -m unittest discover -s tests -p 'test_planning_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -X utf8 scripts/planning_smoke.py --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/planning_*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  legacy-full:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install legacy full environment
        shell: pwsh
        run: |
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full Python and Node regression
        shell: pwsh
        run: |
          python -B -X utf8 -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/planning_*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
