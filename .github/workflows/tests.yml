name: Regression tests
on: [push, pull_request]
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Python regression (no model downloads)
        run: python -B -X utf8 -m unittest discover -s tests -p 'test_*.py'
      - name: Browser module regression
        run: node --test tests/planning_*.test.mjs
